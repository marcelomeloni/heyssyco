    <script> function redirecionar(pagina) {
        window.location.href = pagina;

    function trocarImagem(elemento, novaImagem) {
            elemento.style.backgroundImage = `url('${novaImagem}')`;
        }

        function restaurarImagem(elemento, imagemOriginal) {
            elemento.style.backgroundImage = `url('${imagemOriginal}')`;
        }
        function mostrarBloqueado(elemento) {
            const bloqueadoDiv = document.createElement('div');
    bloqueadoDiv.className = 'bloqueado-overlay';

    const bloqueadoIcon = document.createElement('i');
    bloqueadoIcon.className = 'fa-solid fa-lock';
    bloqueadoDiv.appendChild(bloqueadoIcon);

    const indisponivelText = document.createElement('div');
    indisponivelText.textContent = 'Indisponível';
    bloqueadoDiv.appendChild(indisponivelText);

    elemento.appendChild(bloqueadoDiv);
}
function ocultarBloqueado(elemento) {
    const bloqueadoDiv = elemento.querySelector('.bloqueado-overlay');
    if (bloqueadoDiv) {
        bloqueadoDiv.remove();
    }
}
